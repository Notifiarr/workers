name: build-and-release
on:
  push:
    branches:
      - unstable
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
      - unstable
permissions:
  contents: read
jobs:
  test:
    name: test
    # Noble matches the worker hosts. Ubuntu 26.04 has no ondrej PHP suite.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - name: Build and install package
        run: bash .github/scripts/test-package.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/unstable' || github.ref == 'refs/heads/main'
    needs: test
    outputs:
      version: ${{ steps.release.outputs.version }}
    name: Make Release Assets
    runs-on: ubuntu-24.04
    env:
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # we need the whole thing so we can count commits.
          fetch-depth: "0"
      - name: make-release
        id: release
        run: |
          sudo apt install -y fakeroot zip debsigs gnupg jq
          sudo gem install --no-document fpm
          echo "${GPG_SIGNING_KEY}" | gpg --import -
          bash build.sh
          mkdir release
          mv *.deb release
      - name: upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release

  deploy-nonpublic-packagecloud:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    name: Deploy Nonpublic PackageCloud
    runs-on: ubuntu-24.04
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - uses: golift/upload-packagecloud@eb0067369b59340b04dce218010960ebe74720b2 # v1.1.1
        with:
          userrepo: golift/nonpublic
          apitoken: ${{ secrets.PACKAGECLOUD_TOKEN }}
          packages: .
          debdists: ubuntu/focal
